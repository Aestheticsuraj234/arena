# Production stack. Use ./scripts/setup-production.sh, or:
#
#   cp .env.production.example .env.production   # fill it in
#   ./scripts/build-images.sh                      # sandbox runtime images
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Public: Caddy on 80/443. Grafana is bound to localhost only (use an SSH tunnel).
x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile
  args:
    BASE_REGISTRY: ${BASE_REGISTRY:-docker.io/library}
    NEXT_PUBLIC_API_URL: ${API_URL}

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://arena:${POSTGRES_PASSWORD}@postgres:5432/arena
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: arena
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arena']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  # Migrations + languages (+ sample problems). Runs once per deploy, then exits.
  setup-db:
    image: arena-api:${ARENA_TAG:-latest}
    build:
      <<: *app-build
      target: api
    command: ['node', 'dist/setup-db.js']
    environment:
      <<: *app-env
      SEED_PROBLEMS: ${SEED_PROBLEMS:-true}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    image: arena-api:${ARENA_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: 4000
      API_URL: ${API_URL}
      WEB_URL: ${WEB_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    depends_on:
      setup-db: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  # Needs the host's Docker socket to start sandboxes: run it on a host that
  # only runs Arena. Scale with `--scale worker=N` or WORKER_CONCURRENCY.
  worker:
    image: arena-worker:${ARENA_TAG:-latest}
    build:
      <<: *app-build
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 60s
    depends_on:
      setup-db: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    image: arena-web:${ARENA_TAG:-latest}
    build:
      <<: *app-build
      target: web
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_ADDRESS: ${WEB_ADDRESS:?set WEB_ADDRESS}
      API_ADDRESS: ${API_ADDRESS:?set API_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/arena.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  prometheus-data:
  grafana-data:
