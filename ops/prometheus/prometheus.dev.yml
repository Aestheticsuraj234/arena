# Prometheus for local development: API and worker run on the host (`pnpm dev`).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: arena-api
    static_configs:
      - targets: ['host.docker.internal:4000']

  - job_name: arena-worker
    static_configs:
      - targets: ['host.docker.internal:9465']
