# Prometheus for the production Compose stack (service names on the internal network).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: arena-api
    metrics_path: /metrics
    # Uncomment when METRICS_TOKEN is set on the API.
    # authorization:
    #   credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['api:4000']

  - job_name: arena-worker
    static_configs:
      - targets: ['worker:9465']
